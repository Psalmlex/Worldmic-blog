<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posts — World Mic Admin</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/ai-floating.css" />
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu-btn" onclick="openSidebar()" aria-label="Open menu">☰</button><div class="topbar-title" id="postsPageTitle">Posts</div></div>
      <div class="topbar-actions">
        <input class="admin-search" type="text" id="searchPosts" placeholder="Search posts…" oninput="filterPosts()" />
        <a href="/admin-create.html" class="btn btn-primary btn-sm">+ New Post</a>
        <div class="admin-avatar" id="adminAvatar">A</div>
      </div>
    </div>
    <div class="admin-content">
      <div id="pendingDeletionsCard" class="table-card" style="display:none;margin-bottom:20px;border:1.5px solid #f59e0b">
        <div class="table-header"><h2>⚠️ Pending Deletion Requests</h2></div>
        <div id="pendingDeletionsBody" style="padding:14px"></div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm active" data-filter="all" onclick="setFilter('all',this)">All</button>
        <button class="btn btn-ghost btn-sm" data-filter="published" onclick="setFilter('published',this)">Published</button>
        <button class="btn btn-ghost btn-sm" data-filter="draft" onclick="setFilter('draft',this)">Drafts</button>
      </div>
      <div class="table-card">
        <div class="table-header">
          <h2 id="tableTitle">All Posts</h2>
          <span id="postCount" style="font-size:0.85rem;color:#7a7a8a"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Views</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="postsBody"><tr><td colspan="6" style="text-align:center;padding:30px;color:#9a9aaa">Loading posts…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Delete Post</div><button class="modal-close" onclick="closeModal('deleteModal')">✕</button></div>
    <div class="modal-body"><p>Are you sure you want to delete this post? This action cannot be undone.</p></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('deleteModal')">Cancel</button><button class="btn btn-danger" id="confirmDelete">Delete</button></div>
  </div>
</div>

<script src="/js/admin.js"></script>
<script src="/js/ai-chat.js"></script>
<script>
  let allPosts = [], currentFilter = 'all';

  document.addEventListener('DOMContentLoaded', async () => {
    if (!await requireAuth()) return;
    renderAdminLayout('/admin-posts.html');
    if (localStorage.getItem('wm_role') !== 'admin') document.getElementById('postsPageTitle').textContent = 'My Posts';
    loadPosts();
    if (localStorage.getItem('wm_role') === 'admin') loadPendingDeletions();
  });

  async function loadPendingDeletions() {
    try {
      const pending = await adminFetch('/posts/admin/pending-deletions');
      const card = document.getElementById('pendingDeletionsCard');
      if (!pending.length) { card.style.display = 'none'; return; }
      card.style.display = '';
      document.getElementById('pendingDeletionsBody').innerHTML = pending.map(p => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">
          <div><strong>${p.title}</strong> <span style="color:#9a9aaa;font-size:0.8rem">— requested by ${p.deletionRequestedBy || 'editor'}</span></div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-danger btn-sm" onclick="approveDeletion('${p._id}')">Approve & Delete</button>
            <button class="btn btn-ghost btn-sm" onclick="rejectDeletion('${p._id}')">Reject</button>
          </div>
        </div>`).join('');
    } catch (err) { /* not admin or failed — silently skip */ }
  }

  async function approveDeletion(id) {
    if (!confirmAction('Permanently delete this post?')) return;
    try {
      await adminFetch(`/posts/${id}`, { method: 'DELETE' });
      showToast('Post deleted', 'success');
      loadPosts(); loadPendingDeletions();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function rejectDeletion(id) {
    try {
      await adminFetch(`/posts/${id}/reject-deletion`, { method: 'POST' });
      showToast('Deletion request rejected', 'success');
      loadPosts(); loadPendingDeletions();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function loadPosts() {
    try {
      allPosts = await adminFetch('/posts/admin/all');
      renderTable(allPosts);
    } catch (err) { showToast(err.message, 'error'); }
  }

  function renderTable(posts) {
    const isAdmin = localStorage.getItem('wm_role') === 'admin';
    const filtered = posts.filter(p => {
      const q = document.getElementById('searchPosts').value.toLowerCase();
      const matchFilter = currentFilter === 'all' || p.status === currentFilter;
      const matchSearch = !q || p.title.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
      return matchFilter && matchSearch;
    });
    document.getElementById('postCount').textContent = `${filtered.length} post${filtered.length !== 1 ? 's' : ''}`;
    const body = document.getElementById('postsBody');
    if (!filtered.length) { body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#9a9aaa">No posts found.</td></tr>'; return; }
    body.innerHTML = filtered.map(p => `
      <tr>
        <td><div style="font-weight:600;color:#1a1a2e;margin-bottom:2px">${p.title}</div><div style="font-size:0.75rem;color:#9a9aaa">ID: ${p._id}</div>${p.deletionRequested ? '<div style="font-size:0.72rem;color:#d97706;font-weight:600;margin-top:2px">⚠️ Deletion pending approval</div>' : ''}</td>
        <td><span style="font-size:0.8rem;background:#e8f0fe;color:#1a5eb8;padding:3px 8px;border-radius:4px;font-weight:600">${p.category || 'General'}</span></td>
        <td><span class="badge badge-${p.status}">${p.status}</span></td>
        <td>${p.views}</td>
        <td style="font-size:0.82rem;color:#7a7a8a">${fmtDate(p.createdAt)}</td>
        <td>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <a href="/admin-create.html?id=${p._id}" class="btn btn-ghost btn-sm">Edit</a>
            <button class="btn btn-sm" style="background:#dcfce7;color:#16a34a" onclick="toggleStatus('${p._id}','${p.status}')">${p.status === 'published' ? 'Unpublish' : 'Publish'}</button>
            <a href="/post.html?id=${p._id}" target="_blank" class="btn btn-ghost btn-sm">View</a>
            <button class="btn btn-danger btn-sm" ${p.deletionRequested ? 'disabled' : ''} onclick="deletePost('${p._id}')">${isAdmin ? 'Delete' : (p.deletionRequested ? 'Pending…' : 'Request Delete')}</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function filterPosts() { renderTable(allPosts); }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tableTitle').textContent = f === 'all' ? 'All Posts' : f.charAt(0).toUpperCase() + f.slice(1) + ' Posts';
    renderTable(allPosts);
  }

  async function toggleStatus(id, current) {
    const newStatus = current === 'published' ? 'draft' : 'published';
    try {
      await adminFetch(`/posts/${id}`, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
      showToast(`Post ${newStatus}`, 'success');
      loadPosts();
    } catch (err) { showToast(err.message, 'error'); }
  }

  let pendingDeleteId = null;
  function deletePost(id) {
    pendingDeleteId = id;
    document.getElementById('deleteModal').classList.add('open');
  }
  document.getElementById('confirmDelete').onclick = async () => {
    if (!pendingDeleteId) return;
    try {
      const data = await adminFetch(`/posts/${pendingDeleteId}`, { method: 'DELETE' });
      showToast(data.pending ? 'Deletion requested — waiting for admin approval' : 'Post deleted', 'success');
      closeModal('deleteModal');
      loadPosts();
    } catch (err) { showToast(err.message, 'error'); }
    pendingDeleteId = null;
  };
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
</script>
<script src="/js/pwa.js"></script>
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:199" onclick="closeSidebar()"></div>
<script>
function openSidebar(){document.querySelector(".admin-sidebar").classList.add("open");document.getElementById("sidebarOverlay").style.display="block";}
function closeSidebar(){document.querySelector(".admin-sidebar").classList.remove("open");document.getElementById("sidebarOverlay").style.display="none";}
var mb=document.querySelector(".menu-btn,.hamburger-btn,[onclick*=sidebar],[onclick*=menu]");if(mb)mb.onclick=openSidebar;
</script>
</body>
</html>
