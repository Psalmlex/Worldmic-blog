<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — World Mic</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="main-layout" style="display:block;padding-top:32px;max-width:420px;margin:0 auto;padding-left:24px;padding-right:24px">
    <main style="width:100%">
      <div style="background:var(--bg-white);padding:28px;border-radius:12px;border:1px solid var(--border)">

        <div id="step1">
          <h1 style="font-size:1.4rem;margin-bottom:6px">Forgot Password</h1>
          <p style="color:var(--text-muted);margin-bottom:24px">Enter your username and we'll email you a reset code.</p>
          <form id="requestForm" style="display:flex;flex-direction:column;gap:16px">
            <input class="form-input" id="fpUsername" placeholder="Username" required autocomplete="off" />
            <button type="submit" class="btn btn-primary" id="requestBtn">Send Reset Code</button>
          </form>
          <div id="requestResult" style="font-size:0.9rem;margin-top:10px"></div>
        </div>

        <div id="step2" style="display:none">
          <h1 style="font-size:1.4rem;margin-bottom:6px">Reset Password</h1>
          <p style="color:var(--text-muted);margin-bottom:24px" id="step2Sub"></p>
          <form id="resetForm" style="display:flex;flex-direction:column;gap:16px">
            <input class="form-input" id="rpCode" placeholder="6-digit code" maxlength="6" style="text-align:center;font-size:1.6rem;letter-spacing:8px" inputmode="numeric" required />
            <input class="form-input" id="rpPassword" type="password" placeholder="New password (min 6 characters)" minlength="6" required autocomplete="new-password" />
            <button type="submit" class="btn btn-primary" id="resetBtn">Reset Password</button>
          </form>
          <div id="resetResult" style="font-size:0.9rem;margin-top:10px"></div>
        </div>

      </div>
      <p style="text-align:center;margin-top:16px"><a href="/admin-login.html" style="color:var(--primary)">← Back to login</a></p>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/main.js"></script>
  <script>
    let currentUsername = '';

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('requestBtn');
      const result = document.getElementById('requestResult');
      currentUsername = document.getElementById('fpUsername').value.trim();
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUsername })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = '';
        document.getElementById('step2Sub').textContent = data.message;
      } catch (err) {
        result.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Send Reset Code';
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const result = document.getElementById('resetResult');
      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: currentUsername,
            code: document.getElementById('rpCode').value.trim(),
            newPassword: document.getElementById('rpPassword').value,
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        result.innerHTML = `<span style="color:var(--success)">✅ ${data.message}</span>`;
        setTimeout(() => location.href = '/admin-login.html', 1500);
      } catch (err) {
        result.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });
  </script>
<script src="/js/pwa.js"></script>
</body>
</html>
