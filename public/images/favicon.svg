<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5eb8"/>
      <stop offset="100%" style="stop-color:#0f3d7a"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#1a5eb8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Globe circle -->
  <circle cx="26" cy="30" r="13" fill="none" stroke="url(#globe)" stroke-width="2"/>
  <!-- Globe latitude lines -->
  <ellipse cx="26" cy="30" rx="6" ry="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <line x1="13" y1="30" x2="39" y2="30" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
  <line x1="14" y1="24" x2="38" y2="24" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="14" y1="36" x2="38" y2="36" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Microphone shape -->
  <rect x="39" y="18" width="8" height="14" rx="4" fill="white"/>
  <path d="M36 28 Q36 36 43 36 Q50 36 50 28" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="36" x2="43" y2="42" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="42" x2="47" y2="42" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Signal dot (accent) -->
  <circle cx="52" cy="16" r="4" fill="#e63a2e"/>
</svg>
