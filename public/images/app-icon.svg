<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5eb8"/>
      <stop offset="100%" style="stop-color:#0a2d5e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1a5eb8;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle glow overlay -->
  <ellipse cx="180" cy="160" rx="200" ry="160" fill="url(#glow)"/>

  <!-- Globe -->
  <circle cx="190" cy="260" r="110" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="10"/>
  <ellipse cx="190" cy="260" rx="48" ry="110" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="7"/>
  <line x1="80" y1="260" x2="300" y2="260" stroke="rgba(255,255,255,0.45)" stroke-width="7"/>
  <line x1="84" y1="210" x2="296" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="5"/>
  <line x1="84" y1="310" x2="296" y2="310" stroke="rgba(255,255,255,0.3)" stroke-width="5"/>

  <!-- Microphone body -->
  <rect x="320" y="140" width="70" height="120" rx="35" fill="white"/>
  <!-- Mic grill lines -->
  <line x1="320" y1="185" x2="390" y2="185" stroke="rgba(26,94,184,0.25)" stroke-width="3"/>
  <line x1="320" y1="200" x2="390" y2="200" stroke="rgba(26,94,184,0.25)" stroke-width="3"/>
  <line x1="320" y1="215" x2="390" y2="215" stroke="rgba(26,94,184,0.25)" stroke-width="3"/>
  <!-- Mic arm -->
  <path d="M295 270 Q295 340 355 340 Q415 340 415 270" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <!-- Mic stand -->
  <line x1="355" y1="340" x2="355" y2="395" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="315" y1="395" x2="395" y2="395" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Live signal dot -->
  <circle cx="420" cy="132" r="28" fill="#e63a2e"/>
  <circle cx="420" cy="132" r="14" fill="white"/>

  <!-- "WM" subtle watermark text -->
  <text x="256" y="480" font-family="Georgia,serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.18)" text-anchor="middle" letter-spacing="6">WORLD MIC</text>
</svg>
