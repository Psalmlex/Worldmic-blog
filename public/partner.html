<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner With Us — World Mic</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+3:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
  <script src="/js/analytics.js" defer></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="main-layout" style="display:block;padding-top:32px;max-width:640px;margin:0 auto;padding-left:24px;padding-right:24px">
    <main style="width:100%">
      <h1 class="section-title" style="margin-bottom:8px">Partner With Us</h1>
      <p style="color:var(--text-muted);margin-bottom:28px">Interested in advertising, sponsorships, or a content partnership? Let's talk.</p>

      <form id="partnerForm" style="display:flex;flex-direction:column;gap:16px;background:var(--bg-white);padding:24px;border-radius:12px;border:1px solid var(--border)">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" id="ptName" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input class="form-input" id="ptEmail" type="email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Company / Brand</label>
          <input class="form-input" id="ptCompany" placeholder="e.g. Acme Inc." />
        </div>
        <div class="form-group">
          <label class="form-label">What did you have in mind? *</label>
          <textarea class="form-input" id="ptMessage" style="min-height:140px;resize:vertical" required placeholder="Advertising, sponsored content, affiliate partnership, etc."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="ptSubmit">Send Inquiry</button>
        <div id="ptResult" style="font-size:0.9rem"></div>
      </form>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('partnerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('ptSubmit');
      const result = document.getElementById('ptResult');
      const payload = {
        type: 'partner',
        name: document.getElementById('ptName').value.trim(),
        email: document.getElementById('ptEmail').value.trim(),
        company: document.getElementById('ptCompany').value.trim(),
        message: document.getElementById('ptMessage').value.trim(),
      };
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const data = await apiFetch('/inquiries', { method: 'POST', body: JSON.stringify(payload) });
        result.innerHTML = `<span style="color:var(--success)">✅ ${data.message}</span>`;
        document.getElementById('partnerForm').reset();
      } catch (err) {
        result.innerHTML = `<span style="color:var(--danger)">❌ ${err.message}</span>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Send Inquiry';
      }
    });
  </script>
<script src="/js/pwa.js"></script>
</body>
</html>
